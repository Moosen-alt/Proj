# Solar Submission Autopilot — single-service deploy.
# Usage:
#   1) cp .env.example .env  and fill in SESSION_ENCRYPTION_KEY (+ ANTHROPIC_API_KEY for AI)
#   2) docker compose up -d --build
#   3) open http://localhost:4173   (health: /health, diagnostics: /api/diagnostics)
services:
  app:
    build: .
    image: solar-submission-autopilot:latest
    ports:
      - "${PORT:-4173}:4173"
    env_file:
      - .env
    # Every piece of state (database, documents, backups, portal login profiles, draft ledger,
    # run bundles, screenshots, logs) lives under AUTOPILOT_STATE_DIR (backend/src/statePaths.ts).
    # Keep it equal to the volume path below, or that state is lost on every redeploy.
    environment:
      AUTOPILOT_STATE_DIR: /app/backend/data
    volumes:
      - solar-data:/app/backend/data
    restart: unless-stopped

volumes:
  solar-data:
